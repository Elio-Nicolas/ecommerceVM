name: ecommerceVM CI

on:
  pull_request:
    branches: [main, fix/admin-shipping-method-guard, feature/arca-invoicing-foundation, feature/arca-wsaa-client-v2, feature/arca-wsfe-readonly-v1]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main, feature/enviopack-checkout, 'feat/**']

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  api:
    name: API migrations, Prisma and TypeScript build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommercevm
          POSTGRES_PASSWORD: ecommercevm_dev
          POSTGRES_DB: ecommercevm
        ports:
          - 5547:5432
        options: >-
          --health-cmd "pg_isready -U ecommercevm -d ecommercevm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://ecommercevm:ecommercevm_dev@localhost:5547/ecommercevm?schema=public
      JWT_SECRET: ci-only-secret-not-used-for-deployment-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prisma:deploy
      - run: npm run prisma:generate
      - run: npm run build
