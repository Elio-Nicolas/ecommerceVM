name: ecommerceVM CI

on:
  pull_request:
    branches: [main, fix/admin-shipping-method-guard]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main, feature/enviopack-checkout, 'feat/**']

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  api:
    name: API Prisma and TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://ecommercevm:ecommercevm_dev@localhost:5547/ecommercevm?schema=public
      JWT_SECRET: ci-only-secret-not-used-for-deployment-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run build
